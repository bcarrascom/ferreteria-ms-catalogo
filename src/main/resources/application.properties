spring.application.name=ms-catalogo
server.port=${PORT:8082}

# Lee el archivo .env de la raíz del repo (mismo formato que usa docker compose). Si no existe, se ignora.
spring.config.import=optional:file:.env[.properties]

# ── Base de datos: MySQL, schema propio del servicio ──
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_catalogo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:ferreteria}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ── Seguridad: sin valor por defecto a propósito. Si faltan, el servicio no arranca ──
jwt.secret=${JWT_SECRET}
interno.api-key=${INTERNAL_API_KEY}
