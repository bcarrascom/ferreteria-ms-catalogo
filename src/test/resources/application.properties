# Configuración de tests: reemplaza por completo a la de src/main/resources y no lee el .env.
# Nombre aleatorio: cada contexto de Spring de los tests tiene su propia base en memoria y no se pisan entre sí
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
springdoc.default-produces-media-type=application/json

